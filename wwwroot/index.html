  <style>
    /* ================================================
       COOKIE BANNER – Wangen Pizza Kebab
       Farben: Gold (#C8A45A) + Weiss + Dunkel
    ================================================ */

    #cookie-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 99999;
      justify-content: center;
      align-items: center;
    }

    #cookie-overlay.active {
      display: flex;
    }

    .cookie-banner {
      background: #fff;
      width: min(680px, 94vw);
      border-radius: 14px;
      padding: 32px 36px 28px;
      font-family: 'Segoe UI', Arial, sans-serif;
      position: relative;
      box-shadow: 0 24px 64px rgba(0,0,0,0.28);
      max-width: 95vw;
    }

    .cookie-close {
      position: absolute;
      top: 14px;
      right: 18px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 22px;
      color: #888;
      line-height: 1;
      padding: 4px;
      transition: color .2s;
    }
    .cookie-close:hover { color: #333; }

    .cookie-greeting {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cookie-greeting::before {
      content: '\2605';
      color: #C8A45A;
      font-size: 22px;
    }

    .cookie-text {
      font-size: 14px;
      line-height: 1.65;
      color: #444;
      margin-bottom: 22px;
    }

    .cookie-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cookie-btn {
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
      display: inline-block;
    }

    .cookie-btn-outline {
      background: #fff;
      color: #1a1a1a;
      border: 2px solid #1a1a1a;
    }
    .cookie-btn-outline:hover {
      background: #f5f5f5;
    }

    .cookie-btn-primary {
      background: #C8A45A;
      color: #fff;
      border: 2px solid #C8A45A;
    }
    .cookie-btn-primary:hover {
      background: #b8934f;
      border-color: #b8934f;
    }
  </style>

  </head>
  <body>
    <div id="root"></div>

    <!-- ================================================ -->
    <!-- COOKIE BANNER – Wangen Pizza Kebab             -->
    <!-- ================================================ -->
    <div id="cookie-overlay" role="dialog" aria-label="Cookie-Hinweis">
      <div class="cookie-banner">
        <button class="cookie-close" onclick="closeCookieBanner()" aria-label="Schliessen">&#10005;</button>
        <div class="cookie-greeting">Ciao!</div>
        <p class="cookie-text">
          Wir verwenden Cookies, um eine bestmögliche Nutzung unserer Webseite zu ermöglichen und unsere Kommunikation relevant zu gestalten.
          Weitergehende Informationen erhalten Sie in unseren AGB sowie bei unserer Datenschutzerklärung.
        </p>
        <div class="cookie-actions">
          <a href="/agb" class="cookie-btn cookie-btn-outline" target="_blank">AGB</a>
          <a href="/datenschutz" class="cookie-btn cookie-btn-outline" target="_blank">Datenschutzerklärung</a>
          <button class="cookie-btn cookie-btn-primary" onclick="acceptCookies()">OK</button>
        </div>
      </div>
    </div>

    <script>
      function closeCookieBanner() {
        document.getElementById('cookie-overlay').classList.remove('active');
      }

      function acceptCookies() {
        localStorage.setItem('cookiesAccepted', 'true');
        closeCookieBanner();
      }

      window.addEventListener('load', function() {
        if (!localStorage.getItem('cookiesAccepted')) {
          document.getElementById('cookie-overlay').classList.add('active');
        }
      });
    </script>
    <!-- ENDE COOKIE BANNER -->

    <script>
      if (window.history && 'scrollRestoration' in window.history) {
        window.history.scrollRestoration = 'manual';
      }
    </script>

  </body>
